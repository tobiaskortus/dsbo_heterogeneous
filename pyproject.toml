[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsbo_heterogeneous"
version = "0.1.0"
description = "A small library that extends Dask/Dask-Jobqueue to run heterogeneous worker pools in a single dask cluster."
readme = "README.md"
requires-python = ">=3.10"
license-files = ["THIRD_PARTY_NOTICES.txt"]
authors = [
    { name = "Tobias Kortus", email = "tobias.kortus@rptu.de" }
]
dependencies = [
    "dask>=2026.1.1",
    "dask-jobqueue>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[project.urls]
Homepage = "https://github.com/tobiaskortus/dsbo_heterogeneous"
Issues = "https://github.com/tobiaskortus/dsbo_heterogeneous/issues"

[tool.setuptools]
packages = ["dsbo_heterogeneous"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
